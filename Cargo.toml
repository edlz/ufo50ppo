[package]
name = "ufo50ppo"
version = "0.1.0"
edition = "2024"
default-run = "ufo50ppo"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
tch = "0.24"
tensorboard-rs = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
